title: MAE 5190 - Fast Robots — Maia Hirsch
description: Hello! My name is Maia Hirsch, and I’m a PhD student in Robotics at Cornell University with a background in Mechanical Engineering. My main interests are robotics, actuation, sensing, and human–robot interaction. In my free time, I enjoy exploring creative projects that combine engineering and design. You can check out my insta <a href='https://www.instagram.com/maiahirschlab/?hl=en'>@maiahirschlab</a> to see all the cool things I make.
